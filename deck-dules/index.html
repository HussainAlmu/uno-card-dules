<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script defer src="app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id='goals'>
        <h2 id="current-goal-text">current goal <span id="current-goal">5000</span></h2>
        <h2 id="goals-reached-text">goals reached <span id="goals-reached">0</span></h2>
    </div>
    <div id="middle-contaner">

        <h1 id="botCards"></h1>
        <h1 id="botCard-img"></h1>
        <h2 id="botTotal"></h2>
        <h1 id="match-result"></h1>
        <ol class="leaderboard">
        </ol>
        <h2 id="total"></h2>
        <h1 id="card-img"></h1>
        <h1 id="cards"></h1>
    </div>
    <div id='play-buttons'>
        <button id="hit">hit</button> <button id="stand">stand</button>
        <button id="play-again">play again</button>

    </div>

    <div id="point-board">
        <h2 id="streek-text">win streak <span id="streak">0</span></h2>
        <div id="point-board-mid">
            <h1><span id="points">500</span> chips </h1>
            <input id="input" type="text"></input>
        </div>
    </div>


</body>

</html>
